<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KERNL &mdash; My account</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="icon" href="/icon-192.png?v=2">
<meta name="theme-color" content="#f3ecfb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>window.__VERCEL_NO_TOOLBAR__ = true;</script>
<script src="/kernl-ui.js"></script>
<link rel="stylesheet" href="/kernl.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/scenes.js"></script>
<style>
.page{padding-top:20px;padding-bottom:24px}
.page h1{font-size:clamp(1.7rem,6vw,2.4rem);font-weight:800;letter-spacing:-.025em}
.page .sub{color:var(--text-2);margin:4px 0 22px}
.stack>*+*{margin-top:22px}
.plan-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.plan-name{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.usage{margin-top:18px}
.usage-top{display:flex;justify-content:space-between;font-size:.88rem;color:var(--text-2);margin-bottom:8px}
.usage-top b{color:var(--text)}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:var(--ok);transition:width .5s}
.reset{font-size:.8rem;color:var(--text-3);margin-top:8px}
details.fold>summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .grow{flex:1}
details.fold>summary .icon{color:var(--text-2);transition:transform .2s}
details.fold[open]>summary .icon{transform:rotate(180deg)}
details.fold>.inner{margin-top:14px}
.portrait{border-left:3px solid var(--accent);padding:4px 0 4px 16px;line-height:1.7;font-style:italic;color:var(--text-2)}
.portrait-foot{font-size:.8rem;color:var(--text-3);margin-top:12px}
.sec-h{font-size:1.05rem;font-weight:800;letter-spacing:-.01em;margin-bottom:6px;display:flex;align-items:baseline;gap:10px}
.sec-h small{font-weight:600;color:var(--text-3);font-size:.82rem}
.lib-sec+.lib-sec{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.lib-sec>summary{padding:10px 0}
.lib-sec .tile{width:46px;height:46px;border-radius:14px;flex-shrink:0;background:var(--g);overflow:hidden;color:var(--ink);border:1.5px solid rgba(23,18,43,.5);box-shadow:0 3px 0 rgba(23,18,43,.22)}
.lib-sec .tile svg{width:100%;height:100%;display:block}
.lib-sec .nm{font-weight:800}
.lib-sec .ct{font-size:.82rem;font-weight:600;color:var(--text-3);margin-left:8px}
.empty{text-align:center;padding:30px 16px;color:var(--text-2)}
.loadingline{display:flex;align-items:center;gap:10px;color:var(--text-2);padding:6px 0}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/" aria-label="KERNL home">K<b>E</b>RNL<small>Read less. Know more.</small></a>
    <div class="topbar-actions">
      <a class="btn ghost sm" href="/app.html" aria-label="Back to the library"><span data-icon="back"></span><span>Back<span class="long"> to the library</span></span></a>
      <button class="iconbtn" data-theme-toggle type="button"></button>
      <button class="btn ghost sm" id="signout" type="button" hidden>Sign out</button>
    </div>
  </div>
</header>

<main class="wrap mid page">
  <h1 id="who">My library</h1>
  <p class="sub" id="who-sub"></p>
  <div class="stack">
    <div class="card pad" id="tier-card"><div class="loadingline"><div class="spinner"></div>Loading&hellip;</div></div>
    <details class="card pad fold" id="portrait-card" hidden>
      <summary><span class="grow">Your reading portrait</span><span data-icon="chevron"></span></summary>
      <div class="inner" id="portrait-body"></div>
    </details>
    <div class="card pad" id="recs-card" hidden>
      <div class="sec-h">Suggested for you</div>
      <div id="recs-list"></div>
    </div>
    <div class="card pad">
      <div class="sec-h" id="lib-title">My books <small id="lib-count"></small></div>
      <div id="library-container"><div class="loadingline"><div class="spinner"></div>Loading your books&hellip;</div></div>
    </div>
  </div>
  <div style="height:38vh" aria-hidden="true"></div>
</main>

<footer class="footer"><div class="wrap"><span>&copy; KERNL &mdash; Read less. Know more.</span><span><a href="/privacy.html">Privacy</a> &nbsp;&middot;&nbsp; <a href="/terms.html">Terms</a></span></div></footer>

<script>
const SUPABASE_URL      = 'https://peebgzfufyklxzdfnesc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZWJnemZ1ZnlrbHh6ZGZuZXNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMjIwNDEsImV4cCI6MjA5MDY5ODA0MX0.TXg5ztQsoGvE5j49GRRtaNdTIVM2jS1-LmMNzu7YA5g';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const PORTRAIT_THRESHOLD = 10;
const { esc, fmtDate, icon, toast } = KUI;
const $ = id => document.getElementById(id);
let _session = null, _guest = false, _items = [], _recs = [], _obs = null;

// The open synopsis follows the scroll: whichever row sits in the middle band of the screen opens.
function observeRows(root) {
  if (!_obs) _obs = new IntersectionObserver(es => es.forEach(e => { const r = e.target.parentElement; if (r) r.classList.toggle('on', e.isIntersecting); }), { rootMargin: '-44% 0px -46% 0px', threshold: 0 });
  (root || document).querySelectorAll('.brow .hd').forEach(h => _obs.observe(h));
}
function rowHtml(title, author, synopsis, key, idx, removable) {
  const g = SCENES.byKey(key);
  return '<div class="brow-wrap"><button class="brow" type="button" data-i="' + idx + '" style="--g:' + g.bg + '"><div class="hd"><span class="tile">' + SCENES.svg(key, { slice: true }) + '</span><span class="tx"><div class="tt">' + esc(title) + '</div><div class="au">' + esc(author || '') + '</div></span></div>' +
    '<div class="syn"><div><p>' + esc(synopsis || '') + '</p></div></div></button>' +
    (removable ? '<button class="rm" type="button" data-rm="' + idx + '" aria-label="Remove ' + esc(title) + '">' + icon('x') + '</button>' : '') + '</div>';
}
function catsOf(s) { try { const c = JSON.parse((s && s.categories) || '[]'); return Array.isArray(c) ? c : []; } catch (e) { return []; } }

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/login.html'; return; }
  _session = session;
  _guest = !!session.user.is_anonymous;
  $('who').textContent = 'My library';
  $('who-sub').textContent = _guest ? 'Browsing as a guest' : session.user.email;
  $('signout').hidden = _guest;

  let profile = null;
  if (!_guest) ({ data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single());
  const { data: library, error } = await sb.from('user_library')
    .select('id, voice, language, added_at, summaries(id, title, author, synopsis, categories)')
    .eq('user_id', session.user.id).order('added_at', { ascending: false });
  if (error) console.warn('library load failed', error.message);
  _items = library || [];
  if (_guest) profile = { tier: 'guest', downloads_used: _items.length };
  renderTierCard(profile);
  renderLibrary();
  if (_guest) { $('portrait-card').hidden = true; $('recs-card').hidden = true; }
  else loadPortraitAndRecs(_items);
}

function renderTierCard(profile) {
  const tier = profile ? profile.tier : 'free';
  const used = profile ? (profile.downloads_used || 0) : 0;
  const limit = tier === 'pro' ? 200 : tier === 'guest' ? 12 : 36;
  const pct = Math.min(100, (used / limit) * 100);
  const reset = profile && profile.downloads_reset ? fmtDate(profile.downloads_reset) : '';
  const color = pct >= 90 ? 'var(--err)' : pct >= 60 ? 'var(--warn)' : 'var(--ok)';
  const name = tier === 'pro' ? 'Pro' : tier === 'guest' ? 'Guest' : 'Free';
  let cta = '';
  if (tier === 'free') cta = '<a class="btn primary" href="/upgrade.html"><span data-icon="star"></span>See Pro</a>';
  if (tier === 'guest') cta = '<a class="btn primary" href="/login.html#signup">Create free account</a>';
  $('tier-card').innerHTML =
    '<div class="plan-row"><div><div class="label">Current plan</div><div class="plan-name">' + name +
    (tier === 'pro' ? ' <span class="badge pro">&pound;20 a year</span>' : '') + '</div></div>' + cta + '</div>' +
    (tier === 'guest' ? '<p class="muted" style="margin-top:14px;line-height:1.55">You are a guest. A free account keeps your books on every device and raises your allowance from 12 to 36.</p>' : '') +
    '<div class="usage"><div class="usage-top"><span>Summaries used</span><b>' + used + ' of ' + limit + '</b></div>' +
    '<div class="bar"><div style="width:' + pct + '%;background:' + color + '"></div></div>' +
    (reset ? '<div class="reset">Resets on ' + esc(reset) + '</div>' : '') + '</div>';
  $('tier-card').querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.getAttribute('data-icon')); el.style.display = 'inline-flex'; });
}

// The reading portrait is tucked away until you want it; suggestions are plain book rows.
async function loadPortraitAndRecs(library) {
  const n = library.length, card = $('portrait-card'), body = $('portrait-body');
  card.hidden = false;
  if (n < PORTRAIT_THRESHOLD) {
    const need = PORTRAIT_THRESHOLD - n;
    body.innerHTML = '<p class="muted" style="line-height:1.6">Read ' + need + ' more book' + (need !== 1 ? 's' : '') + ' and KERNL will write you a short portrait of your reading, with suggestions. ' + n + ' of ' + PORTRAIT_THRESHOLD + ' so far.</p>';
    return;
  }
  body.innerHTML = '<div class="loadingline"><div class="spinner"></div>Writing your portrait&hellip;</div>';
  try {
    const res = await fetch('/api/generate-portrait', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + _session.access_token }, body: '{}' });
    if (!res.ok) throw new Error('API error ' + res.status);
    const data = await res.json();
    body.innerHTML = data.portrait ? '<div class="portrait">' + esc(data.portrait) + '</div><div class="portrait-foot">Based on your library. Updates every 10 books.</div>' : '<p class="muted">No portrait yet.</p>';
    _recs = (data.recommendations || []).slice(0, 3);
    if (_recs.length) await renderRecs();
  } catch (e) {
    body.innerHTML = '<p class="muted">Could not load your portrait just now. Refresh to try again.</p>';
  }
}
async function renderRecs() {
  // Look up each suggestion's categories so its icon matches the shelf it belongs on.
  let cats = {};
  try {
    const list = _recs.map(r => '"' + String(r.title).replace(/"/g, '\\"') + '"').join(',');
    const res = await fetch(SUPABASE_URL + '/rest/v1/summaries?select=title,categories&title=in.(' + encodeURIComponent(list) + ')', { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY } });
    if (res.ok) (await res.json()).forEach(b => { cats[b.title] = catsOf(b); });
  } catch (e) { /* fall back to a default icon */ }
  $('recs-list').innerHTML = _recs.map((r, i) => rowHtml(r.title, r.author, r.synopsis, SCENES.groupFor(cats[r.title] || []), i, false)).join('');
  $('recs-card').hidden = false;
  observeRows($('recs-list'));
}

// Genres start rolled up. The ones opened during this visit stay open when the list redraws (e.g. after removing a book).
// Remembered for this browser tab, so coming back from a book restores the same view even if the page reloads.
const _openShelves = new Set((() => { try { return JSON.parse(sessionStorage.getItem('kernl_lib_open') || '[]'); } catch (e) { return []; } })());
const saveOpenShelves = () => { try { sessionStorage.setItem('kernl_lib_open', JSON.stringify([..._openShelves])); } catch (e) { /* private mode */ } };
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d.classList || !d.classList.contains('lib-sec')) return;
  if (d.open) _openShelves.add(d.dataset.k); else _openShelves.delete(d.dataset.k);
  saveOpenShelves();
}, true);

// Books are filed on the same eight shelves as the library, and the shelves appear as the collection grows.
function renderLibrary() {
  const c = $('library-container');
  $('lib-count').textContent = _items.length ? _items.length + (_items.length === 1 ? ' book' : ' books') : '';
  if (!_items.length) {
    c.innerHTML = '<div class="empty">Nothing here yet.<div style="margin-top:14px"><a class="btn primary" href="/app.html">Browse the shelves</a></div></div>';
    return;
  }
  const by = {};
  _items.forEach((it, i) => { const s = it.summaries || {}; const k = SCENES.groupFor(catsOf(s)); (by[k] = by[k] || []).push(i); });
  c.innerHTML = SCENES.DISPLAY.filter(k => by[k]).map(k => {
    const g = SCENES.byKey(k);
    return '<details class="fold lib-sec" data-k="' + k + '"' + (_openShelves.has(k) ? ' open' : '') + ' style="--g:' + g.bg + '"><summary><span class="tile">' + SCENES.svg(k, { slice: true }) + '</span><span class="grow"><span class="nm">' + esc(g.name) + '</span><span class="ct">' + by[k].length + '</span></span><span>' + icon('chevron') + '</span></summary>' +
      '<div class="inner">' + by[k].map(i => { const it = _items[i], s = it.summaries || {}; return rowHtml(s.title || '', s.author, s.synopsis, k, i, !_guest); }).join('') + '</div></details>';
  }).join('');
  observeRows(c);
  // Back from a book on a fresh page load: return to the same place in the list.
  let y = null; try { y = sessionStorage.getItem('kernl_lib_scroll'); sessionStorage.removeItem('kernl_lib_scroll'); } catch (e) { /* ignore */ }
  if (y) requestAnimationFrame(() => window.scrollTo(0, +y));
}

function openBook(title, author, id) {
  if (!title) return;
  try { sessionStorage.setItem('kernl_lib_scroll', String(Math.round(window.scrollY))); } catch (e) { /* private mode */ }
  window.location.href = '/app.html?title=' + encodeURIComponent(title) + '&author=' + encodeURIComponent(author || '') + (id != null ? '&id=' + encodeURIComponent(id) : '') + '&from=library';
}

document.addEventListener('click', async e => {
  const rm = e.target.closest('[data-rm]');
  if (rm) {
    const it = _items[+rm.dataset.rm]; if (!it) return;
    const t = (it.summaries || {}).title || 'this book';
    const ok = await KUI.confirm('Remove from your library?', '“' + t + '” will leave your list. It still counts towards your allowance, and you can open it again from the shelves.', 'Remove', { danger: true });
    if (!ok) return;
    const { error } = await sb.from('user_library').delete().eq('id', it.id);
    if (error) { toast('Could not remove it: ' + error.message, 'err'); return; }
    toast('Removed.', 'ok');
    init();
    return;
  }
  const row = e.target.closest('.brow'); if (!row) return;
  if (row.closest('#recs-list')) { const r = _recs[+row.dataset.i]; if (r) openBook(r.title, r.author); }
  else { const s = (_items[+row.dataset.i] || {}).summaries || {}; openBook(s.title, s.author, s.id); }
});
$('signout').addEventListener('click', async () => { await sb.auth.signOut(); window.location.href = '/login.html'; });
init();
</script>
</body>
</html>
