<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KERNL &mdash; My account</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#f3ecfb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>window.__VERCEL_NO_TOOLBAR__ = true;</script>
<script src="/kernl-ui.js"></script>
<link rel="stylesheet" href="/kernl.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.page{padding:32px 0 24px}
.page h1{font-family:var(--serif);font-size:clamp(1.7rem,4.5vw,2.3rem);margin-bottom:6px}
.stack>*+*{margin-top:18px}
.plan-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.plan-name{font-family:var(--serif);font-size:1.5rem;font-weight:600}
.usage{margin-top:20px}
.usage-top{display:flex;justify-content:space-between;font-size:.88rem;color:var(--text-2);margin-bottom:8px}
.usage-top b{color:var(--text)}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track>div{height:100%;border-radius:99px;background:var(--ok);transition:width .5s}
.reset{font-size:.8rem;color:var(--text-3);margin-top:8px}
.portrait{border-left:3px solid var(--accent);padding:6px 0 6px 18px;font-family:var(--serif);font-size:1.05rem;line-height:1.7;font-style:italic}
.portrait-foot{font-size:.8rem;color:var(--text-3);margin-top:14px}
.recs{display:grid;gap:10px}
.rec{display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);transition:border-color .15s}
.rec:hover{border-color:var(--accent)}
.rec b{display:block;font-family:var(--serif);font-size:1rem}
.rec span{display:block;font-size:.82rem;color:var(--text-2)}
.rec i{display:block;font-size:.82rem;color:var(--text-3);margin-top:6px;line-height:1.5}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.shelf .item{position:relative}
.shelf .book{width:100%}
.shelf .rm{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.shelf .rm svg{width:15px;height:15px}
.shelf .item:hover .rm,.shelf .rm:focus-visible{opacity:1}
@media (hover:none){.shelf .rm{opacity:.9}}
.shelf .when{font-size:.74rem;color:var(--text-3);margin-top:6px}
.empty{text-align:center;padding:36px 16px;border:1px dashed var(--line-strong);border-radius:var(--r);color:var(--text-2)}
.loadingline{display:flex;align-items:center;gap:10px;color:var(--text-2);padding:8px 0}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/" aria-label="KERNL home">K<b>E</b>RNL<small>for the curious</small></a>
    <div class="topbar-actions">
      <a class="btn ghost sm" href="/app.html"><span data-icon="back"></span>Back to the library</a>
      <button class="iconbtn" data-theme-toggle type="button"></button>
      <button class="btn ghost sm" id="signout" type="button" hidden>Sign out</button>
    </div>
  </div>
</header>

<main class="wrap mid page">
  <h1 id="who">My account</h1>
  <p class="muted" id="who-sub" style="margin-bottom:22px"></p>
  <div class="stack">
    <div class="card pad" id="tier-card"><div class="loadingline"><div class="spinner"></div>Loading account&hellip;</div></div>
    <div id="portrait-section"></div>
    <div id="recs-section"></div>
    <div class="card pad">
      <div class="card-title" id="lib-title">My books</div>
      <div id="library-container"><div class="loadingline"><div class="spinner"></div>Loading your books&hellip;</div></div>
    </div>
  </div>
</main>

<footer class="footer"><div class="wrap"><span>&copy; KERNL &mdash; for the curious</span><span><a href="/privacy.html">Privacy</a> &nbsp;&middot;&nbsp; <a href="/terms.html">Terms</a></span></div></footer>

<script>
const SUPABASE_URL      = 'https://peebgzfufyklxzdfnesc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZWJnemZ1ZnlrbHh6ZGZuZXNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMjIwNDEsImV4cCI6MjA5MDY5ODA0MX0.TXg5ztQsoGvE5j49GRRtaNdTIVM2jS1-LmMNzu7YA5g';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const PORTRAIT_THRESHOLD = 10;
const { esc, fmtDate, icon, toast } = KUI;
const $ = id => document.getElementById(id);
let _session = null, _guest = false, _items = [];

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/login.html'; return; }
  _session = session;
  _guest = !!session.user.is_anonymous;
  $('who').textContent = _guest ? 'Your books' : 'My account';
  $('who-sub').textContent = _guest ? 'Browsing as a guest' : session.user.email;
  $('signout').hidden = _guest;
  if (_guest) $('lib-title').textContent = 'My books';

  let profile = null;
  if (!_guest) ({ data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single());
  const { data: library, error } = await sb.from('user_library')
    .select('id, voice, language, added_at, summaries(title, author, synopsis)')
    .eq('user_id', session.user.id).order('added_at', { ascending: false });
  if (error) console.warn('library load failed', error.message);
  _items = library || [];
  if (_guest) profile = { tier: 'guest', downloads_used: _items.length };
  renderTierCard(profile);
  renderLibrary();
  if (_guest) { $('portrait-section').innerHTML = ''; $('recs-section').innerHTML = ''; }
  else loadPortraitAndRecs(_items);
}

function renderTierCard(profile) {
  const tier = profile ? profile.tier : 'free';
  const used = profile ? (profile.downloads_used || 0) : 0;
  const limit = tier === 'pro' ? 200 : tier === 'guest' ? 12 : 36;
  const pct = Math.min(100, (used / limit) * 100);
  const reset = profile && profile.downloads_reset ? fmtDate(profile.downloads_reset) : '';
  const color = pct >= 90 ? 'var(--err)' : pct >= 60 ? 'var(--warn)' : 'var(--ok)';
  const name = tier === 'pro' ? 'Pro' : tier === 'guest' ? 'Guest' : 'Free';
  let cta = '';
  if (tier === 'free') cta = '<a class="btn primary" href="/upgrade.html"><span data-icon="star"></span>See Pro</a>';
  if (tier === 'guest') cta = '<a class="btn primary" href="/login.html#signup">Create free account</a>';
  $('tier-card').innerHTML =
    '<div class="plan-row"><div><div class="label">Current plan</div><div class="plan-name">' + name +
    (tier === 'pro' ? ' <span class="badge pro">&pound;20 a year</span>' : '') + '</div></div>' + cta + '</div>' +
    (tier === 'guest' ? '<p class="muted" style="margin-top:14px;line-height:1.55">You are a guest. A free account keeps your books on every device and raises your allowance from 12 to 36.</p>' : '') +
    '<div class="usage"><div class="usage-top"><span>Summaries used</span><b>' + used + ' of ' + limit + '</b></div>' +
    '<div class="track"><div style="width:' + pct + '%;background:' + color + '"></div></div>' +
    (reset ? '<div class="reset">Resets on ' + esc(reset) + '</div>' : '') + '</div>';
  KUI.hydrateIcons && KUI.hydrateIcons($('tier-card'));
  $('tier-card').querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.getAttribute('data-icon')); el.style.display = 'inline-flex'; });
}

async function loadPortraitAndRecs(library) {
  const n = library.length, ps = $('portrait-section'), rs = $('recs-section');
  if (n < PORTRAIT_THRESHOLD) {
    const need = PORTRAIT_THRESHOLD - n;
    ps.innerHTML = '<div class="card pad"><div class="card-title">Your reading portrait</div><p class="muted" style="line-height:1.6">Read ' + need + ' more book' + (need !== 1 ? 's' : '') + ' and KERNL will write you a short portrait of your reading, with recommendations. ' + n + ' of ' + PORTRAIT_THRESHOLD + ' so far.</p></div>';
    rs.innerHTML = '';
    return;
  }
  ps.innerHTML = '<div class="card pad"><div class="card-title">Your reading portrait</div><div class="loadingline"><div class="spinner"></div>Writing your portrait&hellip;</div></div>';
  try {
    const res = await fetch('/api/generate-portrait', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + _session.access_token }, body: '{}' });
    if (!res.ok) throw new Error('API error ' + res.status);
    const data = await res.json();
    ps.innerHTML = data.portrait
      ? '<div class="card pad"><div class="card-title">Your reading portrait</div><div class="portrait">' + esc(data.portrait) + '</div><div class="portrait-foot">Based on your library. Updates every 10 books.</div></div>'
      : '';
    const recs = data.recommendations || [];
    rs.innerHTML = recs.length
      ? '<div class="card pad"><div class="card-title">Recommended for you</div><div class="recs">' +
        recs.map((r, i) => '<button class="rec" type="button" data-r="' + i + '"><b>' + esc(r.title) + '</b><span>by ' + esc(r.author) + '</span>' + (r.synopsis ? '<i>' + esc(r.synopsis) + '</i>' : '') + '</button>').join('') + '</div></div>'
      : '';
    rs._recs = recs;
  } catch (e) {
    ps.innerHTML = '<div class="card pad"><div class="card-title">Your reading portrait</div><p class="muted">Could not load your portrait just now. Refresh to try again.</p></div>';
  }
}

function renderLibrary() {
  const c = $('library-container');
  if (!_items.length) {
    c.innerHTML = '<div class="empty">Nothing here yet.<div style="margin-top:14px"><a class="btn primary" href="/app.html">Browse the library</a></div></div>';
    return;
  }
  c.innerHTML = '<div class="shelf">' + _items.map((it, i) => {
    const s = it.summaries || {}, t = s.title || '', a = s.author || '';
    return '<div class="item"><button class="book" type="button" data-open="' + i + '" aria-label="' + esc(t) + '">' +
      '<span class="cover" style="' + KUI.coverStyle(t) + '"><span class="cover-title">' + esc(t) + '</span><span class="cover-author">' + esc(a) + '</span></span></button>' +
      (_guest ? '' : '<button class="rm" type="button" data-rm="' + i + '" aria-label="Remove ' + esc(t) + '">' + icon('x') + '</button>') +
      '<div class="when">' + esc(fmtDate(it.added_at)) + '</div></div>';
  }).join('') + '</div>';
}

function openBook(title, author) {
  if (!title) return;
  window.location.href = '/app.html?title=' + encodeURIComponent(title) + '&author=' + encodeURIComponent(author || '');
}

document.addEventListener('click', async e => {
  const o = e.target.closest('[data-open]');
  if (o) { const s = (_items[+o.dataset.open] || {}).summaries || {}; openBook(s.title, s.author); return; }
  const r = e.target.closest('.rec');
  if (r) { const x = ($('recs-section')._recs || [])[+r.dataset.r]; if (x) openBook(x.title, x.author); return; }
  const rm = e.target.closest('[data-rm]');
  if (rm) {
    const it = _items[+rm.dataset.rm]; if (!it) return;
    const t = (it.summaries || {}).title || 'this book';
    const ok = await KUI.confirm('Remove from your library?', '“' + t + '” will leave your list. It will still count towards your allowance, and you can open it again from the library.', 'Remove', { danger: true });
    if (!ok) return;
    const { error } = await sb.from('user_library').delete().eq('id', it.id);
    if (error) { toast('Could not remove it: ' + error.message, 'err'); return; }
    toast('Removed.', 'ok');
    init();
  }
});
$('signout').addEventListener('click', async () => { await sb.auth.signOut(); window.location.href = '/login.html'; });
init();
</script>
</body>
</html>
